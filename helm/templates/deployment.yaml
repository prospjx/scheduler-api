apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "schedulerapi.fullname" . }}-deployment
  labels:
    {{- include "schedulerapi.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    type: {{ .Values.strategy.type }}
  selector:
    matchLabels:
      {{- include "schedulerapi.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "schedulerapi.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.service.targetPort }}
          env:
            - name: POSTGRES_USER
              valueFrom:
                configMapKeyRef:
                  name: {{ include "schedulerapi.fullname" . }}-configmap
                  key: POSTGRES_USER
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: {{ include "schedulerapi.fullname" . }}-configmap
                  key: POSTGRES_DB
            - name: COURSE_API_URL
              valueFrom:
                configMapKeyRef:
                  name: {{ include "schedulerapi.fullname" . }}-configmap
                  key: COURSE_API_URL
            - name: STUDENT_API_URL
              valueFrom:
                configMapKeyRef:
                  name: {{ include "schedulerapi.fullname" . }}-configmap
                  key: STUDENT_API_URL
            - name: AI_ASSISTANT_API_URL
              valueFrom:
                configMapKeyRef:
                  name: {{ include "schedulerapi.fullname" . }}-configmap
                  key: AI_ASSISTANT_API_URL
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ default (printf "%s-secret" (include "schedulerapi.fullname" .)) .Values.secrets.existingSecretName }}
                  key: POSTGRES_PASSWORD
            - name: DATABASE_URL
              value: {{ default "postgresql://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@postgres-service:5432/$(POSTGRES_DB)" .Values.databaseUrl | quote }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
