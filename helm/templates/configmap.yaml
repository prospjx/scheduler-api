apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "schedulerapi.fullname" . }}-configmap
  labels:
    {{- include "schedulerapi.labels" . | nindent 4 }}
data:
  COURSE_API_URL: {{ .Values.config.courseApiUrl | quote }}
  STUDENT_API_URL: {{ .Values.config.studentApiUrl | quote }}
  AI_ASSISTANT_API_URL: {{ .Values.config.aiAssistantApiUrl | quote }}
  POSTGRES_USER: {{ .Values.config.postgresUser | quote }}
  POSTGRES_DB: {{ .Values.config.postgresDb | quote }}
  DB_HOST: {{ .Values.config.dbHost | quote }}
  DB_PORT: {{ .Values.config.dbPort | quote }}
